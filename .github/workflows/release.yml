name: Release & CI

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: write

jobs:
  check:
    name: Test & Lint
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: gcc
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4

      - name: Configure Cargo for CI
        run: rm -f .cargo/config.toml

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev xvfb
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy, rustfmt

      - name: Cargo fmt
        run: cargo fmt --all -- --check

      - name: Cargo clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Cargo test
        run: cargo test --workspace

  build-release:
    name: Build Release Binary
    runs-on: ubuntu-latest
    needs: check
    env:
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: gcc
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4

      - name: Configure Cargo for CI
        run: rm -f .cargo/config.toml

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev xvfb
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Build release binary
        run: cargo build --release

      - name: Package release tarball
        run: |
          VERSION="${{ github.ref_name }}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then
            VERSION="v0.1.1"
          fi
          ARCHIVE_NAME="ru-marketplace-mcp-${VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          tar -czvf "${ARCHIVE_NAME}" -C target/release ru-marketplace-mcp
          sha256sum "${ARCHIVE_NAME}" > "${ARCHIVE_NAME}.sha256"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ru-marketplace-mcp-linux-x86_64
          path: target/release/ru-marketplace-mcp

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ru-marketplace-mcp-*-x86_64-unknown-linux-gnu.tar.gz
            ru-marketplace-mcp-*-x86_64-unknown-linux-gnu.tar.gz.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
